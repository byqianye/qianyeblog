<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>博客后台</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-app">
    <aside class="sidebar">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>博客后台</h1>
      </div>
      <nav aria-label="后台导航">
        <button class="nav-item active" data-panel="posts">文章管理</button>
        <button class="nav-item" data-panel="home">站点设置</button>
        <button class="nav-item" data-panel="media">图片上传</button>
      </nav>
      <button id="logout" class="ghost-button">退出登录</button>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Content Studio</p>
          <h2 id="panel-title">文章管理</h2>
        </div>
        <div class="status" id="status">已连接</div>
      </header>

      <section class="panel active" id="panel-posts">
        <div class="split-layout">
          <section class="list-pane">
            <div class="pane-heading">
              <h3>文章</h3>
              <button id="new-post">新建</button>
            </div>
            <div id="post-list" class="post-list"></div>
          </section>

          <form id="post-form" class="editor-pane">
            <input type="hidden" name="originalSlug" />
            <p id="post-edit-status" class="edit-status">正在新建文章</p>
            <label>Slug<input name="slug" placeholder="morning-notes" required /></label>
            <label>标题<input name="title" required /></label>
            <label>摘要<textarea name="description" rows="2" required></textarea></label>
            <div class="field-grid">
              <label>发布日期<input name="pubDate" type="date" required /></label>
              <div class="tag-field">
                <label for="post-tags">标签</label>
                <input id="post-tags" name="tags" placeholder="日常, 阅读" />
                <div id="tag-options" class="tag-options" aria-label="已有标签选项"></div>
              </div>
            </div>
            <div class="cover-picker">
              <label>封面路径<input name="cover" placeholder="/images/uploads/cover.png" required /></label>
              <div class="cover-picker-head">
                <span>可选封面图片</span>
                <small>悬停预览，点击选择</small>
              </div>
              <div id="cover-options" class="cover-options" aria-label="可选封面图片"></div>
            </div>
            <label class="checkbox"><input name="draft" type="checkbox" /> 草稿，不在访客站显示</label>
            <label>正文 Markdown<textarea name="content" rows="14" required></textarea></label>
            <div class="actions">
              <button type="submit">保存并发布</button>
              <button type="button" id="delete-post" class="danger">删除</button>
            </div>
          </form>
        </div>
        <section class="tag-manager" aria-label="全站标签管理">
          <div class="pane-heading">
            <div>
              <h3>标签管理</h3>
              <p class="hint">重命名或删除会作用到所有文章，并立即重建访客站。</p>
            </div>
            <form id="add-tag-form" class="inline-form">
              <input name="tag" placeholder="新增标签到当前文章" />
              <button type="submit">添加</button>
            </form>
          </div>
          <div id="tag-manager-list" class="tag-manager-list"></div>
        </section>
      </section>

      <section class="panel" id="panel-home">
        <form id="home-form" class="settings-form">
          <div class="settings-intro">
            <strong>常用内容优先</strong>
            <span>先改站点名、作者、首页图文和关于页介绍；导航、模板和无障碍文案放在高级区域。</span>
          </div>
          <fieldset>
            <legend>常用设置</legend>
            <div class="field-grid">
              <label>站点名称<input name="siteTitle" /></label>
              <label>作者名<input name="siteAuthor" /></label>
              <label>站点地址<input name="siteUrl" placeholder="https://qianyeblog.pages.dev" /></label>
              <label>邮箱<input name="siteEmail" /></label>
              <label>品牌方块文字<input name="brandMark" maxlength="2" /></label>
              <label>图标路径<input name="favicon" placeholder="/favicon.svg" /></label>
            </div>
            <label>站点简介<textarea name="siteDescription" rows="2"></textarea></label>
            <details class="advanced-settings">
              <summary>导航和页脚链接</summary>
            <div class="field-grid">
              <label>导航：首页<input name="navHomeLabel" /></label>
              <label>导航：文章<input name="navBlogLabel" /></label>
              <label>导航：标签<input name="navTagsLabel" /></label>
              <label>导航：搜索<input name="navSearchLabel" /></label>
              <label>导航：关于<input name="navAboutLabel" /></label>
              <label>社交：邮箱文字<input name="socialEmailLabel" /></label>
              <label>社交：RSS 文字<input name="socialRssLabel" /></label>
            </div>
            </details>
          </fieldset>

          <fieldset>
            <legend>首页内容</legend>
            <label>首屏小标题<input name="eyebrow" /></label>
            <label>首屏标题<textarea name="title" rows="2"></textarea></label>
            <label>首屏介绍<textarea name="description" rows="3"></textarea></label>
            <label>头图路径<input name="image" placeholder="/images/uploads/hero.png" /></label>
            <label>头图替代文字<input name="imageAlt" /></label>
            <label>分享标签<input name="noteLabel" /></label>
            <label>分享内容<textarea name="note" rows="3"></textarea></label>
            <div class="field-grid">
              <label>主按钮文字<input name="primaryActionLabel" /></label>
              <label>主按钮链接<input name="primaryActionHref" /></label>
              <label>次按钮文字<input name="secondaryActionLabel" /></label>
              <label>次按钮链接<input name="secondaryActionHref" /></label>
            </div>
            <label>分享卡片无障碍名<input name="heroNoteAriaLabel" /></label>
          </fieldset>

          <fieldset>
            <legend>首页分区</legend>
            <div class="field-grid">
              <label>精选区标签<input name="featuredEyebrow" /></label>
              <label>精选区标题<input name="featuredTitle" /></label>
              <label>近来区标签<input name="recentEyebrow" /></label>
              <label>近来区标题<input name="recentTitle" /></label>
              <label>全部入口文字<input name="allSharesLabel" /></label>
              <label>公开数量文字<input name="publicSharesLabel" /></label>
              <label>最近更新文字<input name="recentUpdateLabel" /></label>
              <label>无文章时日期文字<input name="emptyLatestLabel" /></label>
            </div>
            <label>站点信息区无障碍名<input name="journalStripAriaLabel" /></label>
            <label>RSS 分享说明<input name="rssShareLabel" /></label>
          </fieldset>

          <fieldset>
            <legend>页面文案：文章列表</legend>
            <div class="field-grid">
              <label>页面标题<input name="blogPageTitle" /></label>
              <label>页面小标题<input name="blogPageEyebrow" /></label>
              <label>主标题<input name="blogPageHeading" /></label>
            </div>
            <label>页面描述<textarea name="blogPageDescription" rows="2"></textarea></label>
            <label>页面介绍<textarea name="blogPageIntro" rows="3"></textarea></label>
            <details class="advanced-settings">
              <summary>文章卡片模板</summary>
              <div class="field-grid">
                <label>列表无障碍名<input name="blogListAriaLabel" /></label>
                <label>阅读时长模板<input name="readingMinutesTemplate" placeholder="{minutes} 分钟读完" /></label>
                <label>文章标签无障碍名<input name="articleTagsAriaLabel" /></label>
              </div>
              <label>文章图片链接无障碍模板<input name="articleReadAriaTemplate" placeholder="阅读《{title}》" /></label>
            </details>
          </fieldset>

          <fieldset>
            <legend>页面文案：关于</legend>
            <div class="field-grid">
              <label>页面标题<input name="aboutPageTitle" /></label>
              <label>页面小标题<input name="aboutEyebrow" /></label>
              <label>按钮文字<input name="aboutButtonLabel" /></label>
            </div>
            <label>页面描述<textarea name="aboutPageDescription" rows="2"></textarea></label>
            <label>作者介绍<textarea name="aboutIntro" rows="3"></textarea></label>
            <div class="field-grid">
              <label>段落一标题<input name="aboutSectionOneTitle" /></label>
              <label>段落二标题<input name="aboutSectionTwoTitle" /></label>
            </div>
            <label>段落一内容<textarea name="aboutSectionOneBody" rows="3"></textarea></label>
            <label>段落二内容<textarea name="aboutSectionTwoBody" rows="3"></textarea></label>
          </fieldset>

          <fieldset>
            <legend>高级模板：标签页</legend>
            <div class="field-grid">
              <label>标签页小标题<input name="tagsPageEyebrow" /></label>
              <label>标签页标题<input name="tagsPageTitle" /></label>
              <label>标签列表无障碍名<input name="tagsListAriaLabel" /></label>
              <label>标签详情标题前缀<input name="tagDetailTitlePrefix" /></label>
              <label>标签详情小标题<input name="tagDetailEyebrow" /></label>
            </div>
            <label>标签页介绍<textarea name="tagsPageDescription" rows="3"></textarea></label>
            <label>标签详情描述模板<input name="tagDetailDescriptionTemplate" placeholder="浏览标签「{tag}」下的文章。" /></label>
            <label>标签详情数量模板<input name="tagDetailCountTemplate" placeholder="这个标签下共有 {count} 篇文字。" /></label>
            <label>标签详情列表无障碍模板<input name="tagDetailListAriaTemplate" placeholder="标签 {tag} 的文章" /></label>
          </fieldset>

          <button type="submit">保存站点设置并重建</button>
        </form>
      </section>

      <section class="panel" id="panel-media">
        <form id="upload-form" class="upload-box">
          <label>选择图片<input name="image" type="file" accept="image/*" required /></label>
          <button type="submit">上传图片</button>
          <output id="upload-result"></output>
        </form>
        <p class="hint">上传后会返回类似 <code>/images/uploads/xxx.png</code> 的路径，可填入文章封面或首页头图。</p>
        <section class="image-library-panel" aria-label="图片库">
          <div class="pane-heading">
            <div>
              <h3>图片库</h3>
              <p class="hint">先点一下文章封面、首页头图或图标路径输入框，再点击图片即可填入路径。</p>
            </div>
            <button type="button" id="refresh-images" class="ghost-button">刷新</button>
          </div>
          <div id="image-library" class="image-library"></div>
        </section>
        <div id="image-preview" class="image-preview" hidden>
          <img alt="" />
          <span></span>
        </div>
      </section>
    </main>

    <script src="/admin/admin.js" type="module"></script>
  </body>
</html>
